<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="action-header">
    <h1 class="page-title">Produk</h1>
    <ion-button color="success" size="small" class="add-button" (click)="tambahProdukBaru()">
      Tambah Produk
    </ion-button>
  </div>

  <!--Searchbar-->
  <ion-searchbar placeholder="Cari Nama Barang..." class="custom-search" [(ngModel)]="kataKunciPencarian"
    (ionInput)="filterProduk()">
  </ion-searchbar>

  <!--Filter Kategori-->
  <div class="filter-kategori ion-padding-horizontal">
    <ion-label class="filter-label"
      style="font-weight: bold; display: block; margin-bottom: 10px;">Kategori:</ion-label>

    <div class="radio-wrapper">
      <label class="radio-item">
        <input type="radio" name="kategori" value="Semua" [(ngModel)]="kategoriAktif" (change)="filterProduk()"> Semua
      </label>
      <label class="radio-item">
        <input type="radio" name="kategori" value="Sembako" [(ngModel)]="kategoriAktif" (change)="filterProduk()">
        Sembako
      </label>
      <label class="radio-item">
        <input type="radio" name="kategori" value="Makanan" [(ngModel)]="kategoriAktif" (change)="filterProduk()">
        Makanan
      </label>
      <label class="radio-item">
        <input type="radio" name="kategori" value="Minuman" [(ngModel)]="kategoriAktif" (change)="filterProduk()">
        Minuman
      </label>
      <label class="radio-item">
        <input type="radio" name="kategori" value="Perlengkapan" [(ngModel)]="kategoriAktif" (change)="filterProduk()">
        Perlengkapan
      </label>
    </div>
  </div>

  <!-- Gunakan ng-container untuk menghindari error span bungkus card -->
  <ng-container *ngFor="let product of produkTampil">
    <ion-card class="product-cards">
      <!-- Thumbnail kotak simetris (60x60) dari perbaikan sebelumnya -->
      <ion-thumbnail class="product-thumb" (click)="bukaDetail(product.id)">
        <ion-img [src]="product.url || 'https://placehold.co/600x400/png'" [alt]="product.nama"></ion-img>
      </ion-thumbnail>

      <div class="product-info" (click)="bukaDetail(product.id)">
        <ion-card-header>
          <ion-card-title class="custom-title">{{ product.nama }}</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <ion-label class="stock-label">Stok {{ product.stock }}</ion-label>
          <br>
          <ion-label class="price-label">Rp {{ product.harga_jual | number }}</ion-label>
        </ion-card-content>
      </div>

      <div>
        <ion-button *ngIf="getQty(product.id) === 0" (click)="tambahAwal(product)" [disabled]="product.stock === 0">
          <ion-icon name="add-outline"></ion-icon>
        </ion-button>

        <span *ngIf="getQty(product.id) > 0">
          <ion-button fill="clear" class="counter-btn" (click)="kurangQty(product.id)">
            <ion-icon name="remove"></ion-icon>
          </ion-button>

          <span class="counter-text">{{ getQty(product.id) }}</span>

          <ion-button fill="clear" class="counter-btn" (click)="tambahQty(product.id)"
            [disabled]="getQty(product.id) >= product.stock">
            <ion-icon name="add"></ion-icon>
          </ion-button>
        </span>
      </div>
    </ion-card>
  </ng-container>

  <div class="empty-state" *ngIf="produkTampil.length === 0">
    <p>Tidak ada produk ditemukan.</p>
  </div>

  <!-- Button Keranjang -->
  <div class="floating-cart-container" *ngIf="getTotalJenisBarang() > 0">
    <ion-button color="success" class="cart-button" (click)="bukaKeranjang()">
      <ion-icon slot="icon-only" name="cart-outline"></ion-icon>
    </ion-button>
    <ion-badge color="danger" class="floating-cart-badge">
      {{ getTotalJenisBarang() }}
    </ion-badge>
  </div>
</ion-content>
