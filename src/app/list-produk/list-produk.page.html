<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Top Action Row -->
  <div class="action-header">
    <h1 class="page-title">Produk</h1>
    <ion-button size="small" class="add-button" (click)="tambahProdukBaru()">
      Tambah Produk
    </ion-button>
  </div>

  <!--Searchbar-->
  <ion-searchbar placeholder="Cari Nama Barang..." class="custom-search" [(ngModel)]="kataKunciPencarian" (ionInput)="filterProduk()">
  </ion-searchbar>

  <!--Filter Kategori-->
  <div class="filter-kategori">
    <ion-label class="filter-label">Kategori:</ion-label>
    <ion-select [(ngModel)]="kategoriAktif" (ionChange)="filterProduk()" interface="popover" class="kategori-select">
      <ion-select-option value="Semua">Semua</ion-select-option>
      <ion-select-option value="Sembako">Sembako</ion-select-option>
      <ion-select-option value="Makanan">Makanan</ion-select-option>
      <ion-select-option value="Minuman">Minuman</ion-select-option>
      <ion-select-option value="Perlengkapan">Perlengkapan</ion-select-option>
    </ion-select>
  </div>

  <!--produk-cards-->
  <span *ngFor="let product of produkTampil">
    <ion-card class="product-cards">
      <ion-thumbnail class="product-thumb" (click)="bukaDetail(product.id)">
        <ion-img [src]="product.url || 'https://placehold.co/600x400/png'" [alt]="product.nama"></ion-img>
      </ion-thumbnail>

      <div class="product-info" (click)="bukaDetail(product.id)">
        <ion-card-header>
          <ion-card-title class="custom-title">{{ product.nama }}</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <ion-label class="stock-label">Stok {{ product.stock }}</ion-label>
          <br>
          <ion-label class="price-label">Rp {{ product.harga_jual | number }}</ion-label>
        </ion-card-content>
      </div>

      <div>
        <!--Tombol plus awal (jika belum di tambahkan di keranjang)-->
        <ion-button *ngIf="getQty(product.id) === 0" (click)="tambahAwal(product)"
          [disabled]="product.stock === 0">
          <ion-icon name="add-outline"></ion-icon>
        </ion-button>

        <!-- Muncul jika qty di keranjang > 0 -->
        <span *ngIf="getQty(product.id) > 0">
          <ion-button fill="clear" class="counter-btn" (click)="kurangQty(product.id)">
            <ion-icon name="remove"></ion-icon>
          </ion-button>

          <span class="counter-text">{{ getQty(product.id) }}</span>

          <ion-button fill="clear" class="counter-btn" (click)="tambahQty(product.id)" [disabled]="getQty(product.id) >= product.stock">
            <ion-icon name="add"></ion-icon>
          </ion-button>
        </span>
      </div>
    </ion-card>
  </span>

  <div class="empty-state" *ngIf="produkTampil.length === 0">
    <p>Tidak ada produk ditemukan.</p>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="floating-cart-container" *ngIf="getTotalJenisBarang() > 0">
    <ion-fab-button color="success" class="cart-button" (click)="bukaKeranjang()">
      <ion-icon name="cart-outline"></ion-icon>
    </ion-fab-button>
    <ion-badge color="danger" class="floating-cart-badge">
      {{ getTotalJenisBarang() }}
    </ion-badge>
  </ion-fab>
</ion-content>
