<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="action-header">
    <h1 class="page-title">Produk</h1>
    <ion-button color="success" size="small" class="add-button" (click)="tambahProdukBaru()">
      Tambah Produk
    </ion-button>
  </div>

  <ion-item lines="full" class="ion-margin-horizontal">
    <ion-input label="Cari Produk" labelPlacement="stacked" type="text" placeholder="Cari Nama Barang..."
      [(ngModel)]="kataKunciPencarian" (keyup)="filterProduk()"></ion-input>
  </ion-item>

  <!--Filter Kategori-->
  <div class="filter-kategori ion-padding-horizontal">
    <ion-label class="filter-label"
      style="font-weight: bold; display: block; margin-bottom: 10px;">Kategori:</ion-label>

    <div class="radio-wrapper">
      <label class="radio-item">
        <input type="radio" name="kategori" value="Semua" [(ngModel)]="kategoriAktif" (change)="filterProduk()"> Semua
      </label>
      <label class="radio-item">
        <input type="radio" name="kategori" value="Sembako" [(ngModel)]="kategoriAktif" (change)="filterProduk()">
        Sembako
      </label>
      <label class="radio-item">
        <input type="radio" name="kategori" value="Makanan" [(ngModel)]="kategoriAktif" (change)="filterProduk()">
        Makanan
      </label>
      <label class="radio-item">
        <input type="radio" name="kategori" value="Minuman" [(ngModel)]="kategoriAktif" (change)="filterProduk()">
        Minuman
      </label>
      <label class="radio-item">
        <input type="radio" name="kategori" value="Perlengkapan" [(ngModel)]="kategoriAktif" (change)="filterProduk()">
        Perlengkapan
      </label>
    </div>
  </div>

  <ion-card class="product-cards" *ngFor="let product of produkTampil">
    <div class="product-thumb" (click)="bukaDetail(product.id)">
      <ion-img [src]="product.url || 'https://placehold.co/600x400/png'" [alt]="product.nama"></ion-img>
    </div>

    <div class="product-info" (click)="bukaDetail(product.id)">
      <ion-card-header>
        <ion-card-title class="custom-title">{{ product.nama }}</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-label class="stock-label">Stok {{ product.stock }}</ion-label>
        <br>
        <ion-label class="price-label">Rp {{ product.harga_jual }}</ion-label>
      </ion-card-content>
    </div>

    <div>
      <ion-button (click)="tambahKeKeranjang(product)" [disabled]="product.stock === 0 || isItemInKeranjang(product.id)"
        [color]="getWarnaTombol(product.id)">
        <ion-icon [name]="getIkonTombol(product.id)"></ion-icon>
      </ion-button>
    </div>
  </ion-card>

  <div class="empty-state" *ngIf="produkTampil.length === 0">
    <p>Tidak ada produk ditemukan.</p>
  </div>

  <!-- Button Keranjang -->
  <div class="floating-cart-container" *ngIf="getTotalJenisBarang() > 0">
    <ion-button color="success" class="cart-button" (click)="bukaKeranjang()">
      <ion-icon slot="icon-only" name="cart-outline"></ion-icon>
    </ion-button>
    <ion-badge color="danger" class="floating-cart-badge">
      {{ getTotalJenisBarang() }}
    </ion-badge>
  </div>
</ion-content>
