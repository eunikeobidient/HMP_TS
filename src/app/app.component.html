<ion-app>
  <ion-router-outlet id="main-content"></ion-router-outlet>
  <ion-tabs *ngIf="isLoggedIn">
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="home">
        <ion-icon name="home"></ion-icon>
        <ion-label>Dashboard</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="list-produk">
        <ion-icon name="pricetag-outline"></ion-icon>
        <ion-label>Produk</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="transaksi">
        <ion-icon name="receipt-outline"></ion-icon>
        <ion-label>Transaksi</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="profil">
        <ion-icon name="person-circle-outline"></ion-icon>
        <ion-label>Profil</ion-label>
      </ion-tab-button> 
    </ion-tab-bar>
  </ion-tabs>
  
  <ion-menu auto-hide="true" content-id="main-content" *ngIf="isLoggedIn">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu List</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        <ion-menu-toggle>
          <ion-item routerLink="/setting">
            <ion-icon slot="start" name="settings-outline"></ion-icon>
            <ion-label>Pengaturan</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle>
          <ion-item routerLink="/about">
            <ion-icon slot="start" name="information-circle-outline"></ion-icon>
            <ion-label>Tentang Aplikasi</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle>
          <ion-item routerLink="/login" (click)="logout()">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
</ion-app>
