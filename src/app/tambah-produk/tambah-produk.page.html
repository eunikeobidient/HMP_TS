<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="batal()">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Tambah Produk Baru</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-list lines="full">

    <ion-item>
      <ion-input label="Nama Produk *" labelPlacement="stacked" type="text" [(ngModel)]="produkBaru.nama" name="nama"
        placeholder="Masukkan nama produk"></ion-input>
    </ion-item>
    <div class="error-message" *ngIf="isInvalidNama()">
      <small>Nama produk wajib diisi (minimal 3 karakter).</small>
    </div>

    <ion-item>
      <ion-select label="Kategori *" labelPlacement="stacked" [(ngModel)]="produkBaru.kategori" name="kategori"
        placeholder="Pilih kategori">
        <ion-select-option value="Sembako">Sembako</ion-select-option>
        <ion-select-option value="Makanan">Makanan</ion-select-option>
        <ion-select-option value="Minuman">Minuman</ion-select-option>
        <ion-select-option value="Perlengkapan">Perlengkapan</ion-select-option>
      </ion-select>
    </ion-item>
    <div class="error-message" *ngIf="isInvalidKategori()">
      <small>Kategori produk wajib dipilih.</small>
    </div>

    <ion-item>
      <ion-input label="Harga Beli (Rp) *" labelPlacement="stacked" type="number" [(ngModel)]="produkBaru.harga_beli"
        name="harga_beli" placeholder="Contoh: 10000"></ion-input>
    </ion-item>
    <div class="error-message" *ngIf="isInvalidHargaBeli()">
      <small>Harga beli harus berupa angka valid lebih dari 0.</small>
    </div>

    <ion-item>
      <ion-input label="Harga Jual (Rp) *" labelPlacement="stacked" type="number" [(ngModel)]="produkBaru.harga_jual"
        name="harga_jual" placeholder="Contoh: 15000"></ion-input>
    </ion-item>
    <div class="error-message" *ngIf="isInvalidHargaJual()">
      <small>Harga jual harus berupa angka valid lebih dari 0.</small>
    </div>

    <ion-item>
      <ion-input label="Stok *" labelPlacement="stacked" type="number" [(ngModel)]="produkBaru.stock" name="stock"
        placeholder="Contoh: 10"></ion-input>
    </ion-item>
    <div class="error-message" *ngIf="isInvalidStock()">
      <small>Stok tidak boleh kosong atau negatif.</small>
    </div>

    <ion-item>
      <ion-input label="URL Gambar (Opsional)" labelPlacement="stacked" type="url" [(ngModel)]="produkBaru.url"
        name="url" placeholder="https://..."></ion-input>
    </ion-item>

    <div *ngIf="produkBaru.url" style="text-align: center; padding: 10px 0;">
      <img [src]="produkBaru.url" alt="Preview Gambar Produk"
        style="max-height: 180px; max-width: 100%; border-radius: 8px;" />
    </div>

  </ion-list>

  <div class="action-buttons">
    <ion-button expand="block" color="success" (click)="simpanProduk()" class="submit-btn">
      <ion-icon slot="start" name="save"></ion-icon>
      Simpan Produk
    </ion-button>

    <ion-alert [isOpen]="showAlert" header="Simpan Produk" message="Produk berhasil ditambahkan!"
      [buttons]="alertButtons" (didDismiss)="onAlertDismiss()">
    </ion-alert>

    <ion-button expand="block" color="medium" fill="clear" (click)="batal()">
      Batal
    </ion-button>
  </div>

</ion-content>
