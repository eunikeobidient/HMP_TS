<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="absolute-center">Transaksi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Transaksi</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-segment [(ngModel)]="jenisTampilan">
    <ion-segment-button value="harian">
      <ion-label>Harian</ion-label>
    </ion-segment-button>
    <ion-segment-button value="produk">
      <ion-label>Produk</ion-label>
    </ion-segment-button>
  </ion-segment>

  <div *ngIf="jenisTampilan === 'harian'">
    <ion-row>
      <ion-item class="month-year-header" lines="none">
        <ion-label>September 2026</ion-label>
      </ion-item>
    </ion-row>
    <ion-card class="transaction-item">
      <ion-card-subtitle class="transaction-date">
        <h1 class="date">25</h1>
        <p class="month">Sep</p>
        <p class="year">2026</p>
      </ion-card-subtitle>
      <ion-card-subtitle class="transaction-info">
        <p class="receipt-number">TMJ25092026002</p>
        <p>CustomerReceiverName</p>
        <P>Rp25,000.00</P>
      </ion-card-subtitle>
      <ion-button class="btn-detail" routerLink="/detail-transaksi">
        <ion-label>Detail</ion-label>
      </ion-button>
    </ion-card>
  </div>

  <div *ngIf="jenisTampilan === 'produk'">
    <ion-grid>
      <ion-row>
        <ion-col>
          <ion-card>
            <ion-card-header>
              <ion-card-title>
                <h1 class="product-name">Beras</h1>
              </ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <ion-img class="product-img"
                src="https://coreimages.lottemart.co.id/ord/06/3ad20f1c-eaa7-4c58-b920-5d08567893fa.webp"></ion-img>
              <ion-card-subtitle>Jumlah Terjual: 500</ion-card-subtitle>
              <ion-card-subtitle>Bulan: September</ion-card-subtitle>
              <ion-card-subtitle>Tahun: 2026</ion-card-subtitle>
            </ion-card-content>
          </ion-card>
        </ion-col>
        <ion-col>
          <ion-card>
            <ion-card-header>
              <ion-card-title>
                <h1 class="product-name">Beras</h1>
              </ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <ion-img class="product-img"
                src="https://coreimages.lottemart.co.id/ord/06/3ad20f1c-eaa7-4c58-b920-5d08567893fa.webp"></ion-img>
              <ion-card-subtitle>Jumlah Terjual: 500</ion-card-subtitle>
              <ion-card-subtitle>Bulan: September</ion-card-subtitle>
              <ion-card-subtitle>Tahun: 2026</ion-card-subtitle>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
