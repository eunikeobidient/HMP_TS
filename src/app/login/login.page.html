<ion-content [fullscreen]="true" class="ion-padding">
  <div class="login-container">
    <div class="header-section">
      <ion-icon name="cart" color="primary" class="logo-icon"></ion-icon>
      <h1 class="app-title"><strong>SIMOBILE</strong></h1>
      <p class="subtitle">Silahkan login ke akun anda</p>
    </div>

    <ion-list lines="none" class="form-list">
      <ion-item class="input-item">
        <ion-input label="Username" labelPlacement="floating" placeholder="Masukkan Username"
          [(ngModel)]="username"></ion-input>
      </ion-item>
      <ion-item class="input-item">
        <ion-input type="password" label="Password" labelPlacement="floating" placeholder="Masukkan Password"
          [(ngModel)]="password">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </ion-item>
    </ion-list>
    <ion-button expand="block" color="primary" class="login-btn" (click)="login()">
      LOGIN
    </ion-button>
    <ion-alert [isOpen]="loginGagal" (didDismiss)="loginGagal = false" header="KESALAHAN" subHeader="Gagal Login"
      message="Username atau password salah" [buttons]="alertButtons">
    </ion-alert>
  </div>
</ion-content>
