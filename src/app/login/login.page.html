<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">login</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list lines="full">
    <ion-item>
      <ion-input label="Username" labelPlacement="floating" placeholder="Masukkan Username" [(ngModel)]="username"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input type="password" label="Password" labelPlacement="floating" placeholder="Masukkan Password" [(ngModel)]="password">
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>
    </ion-item>
    <ion-item>
      <ion-button (click)="login()">LOGIN</ion-button>
    </ion-item>

    <ion-alert [isOpen]="loginGagal" (didDismiss)="loginGagal = false" header="KESALAHAN" subHeader="Gagal Login"
      message="Username atau password salah" [buttons]="alertButtons">
    </ion-alert>
  </ion-list>
</ion-content>
