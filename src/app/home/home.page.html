<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>
      Dashboard
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Dashboard</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="profile">
    <ion-list>
      <ion-item lines="none">
        <ion-avatar>
          <ion-img
            src="https://images.rawpixel.com/image_png_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIzLTAxL3JtNjA5LXNvbGlkaWNvbi13LTAwMi1wLnBuZw.png"></ion-img>
        </ion-avatar>
        <ion-label>
          <h2>Bu Mami</h2>
          <p>Toko Makmur Jaya</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-card>
          <ion-card-subtitle>Jumlah Produk</ion-card-subtitle>
          <ion-card-title>100</ion-card-title>
        </ion-card>
      </ion-col>
      <ion-col>
        <ion-card>
          <ion-card-subtitle>Transaksi Hari Ini</ion-card-subtitle>
          <ion-card-title>Rp 5.3M</ion-card-title>
        </ion-card>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-card>
          <ion-card-subtitle>Produk Terlaris</ion-card-subtitle>
          <ion-card-content>
            <ion-img id="product-image"
              src="https://image.astronauts.cloud/product-images/2026/7/IndomieGorengSpesial_414accae-05bf-440a-b59f-b9b621dc486c_900x900.png"></ion-img>
            <div id="product-text">
              <ion-card-title class="product-text-item">Indomie Goreng</ion-card-title>
              <ion-card-subtitle class="product-text-item">Jumlah Terjual: 10</ion-card-subtitle>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
