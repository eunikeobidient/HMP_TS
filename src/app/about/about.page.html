<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Tentang Aplikasi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tentang Aplikasi</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="about-container ion-text-center ion-margin-top">
    <h1>SIMOBILE</h1>

    <p class="ion-text-justify ion-margin-bottom" style="color: var(--ion-color-medium);">
      SIMOBILE merupakan app kasir yang dikerjakan untuk UTS Hybrid Mobile Programming oleh team TS.
    </p>

    <ion-card class="ion-margin-top ion-text-left">
      <ion-card-header>
        <ion-card-subtitle color="primary">Team TS</ion-card-subtitle>
        <ion-card-title>Nama Developer</ion-card-title>
      </ion-card-header>

      <ion-list lines="full">
        <ion-item>
          <ion-icon name="person-circle-outline" slot="start" color="secondary"></ion-icon>
          <ion-label>
            <h2>Soen Hizkia</h2>
            <p>160424017</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="person-circle-outline" slot="start" color="secondary"></ion-icon>
          <ion-label>
            <h2>Eunike Obidient Djuwari</h2>
            <p>160424019</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="person-circle-outline" slot="start" color="secondary"></ion-icon>
          <ion-label>
            <h2>Han Christian Gunawan</h2>
            <p>160424041</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card>
  </div>
</ion-content>
